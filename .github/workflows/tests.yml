name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest
      # No API key in CI, so this only proves the harness reads the set and adds up.
      - run: python -m tools.evaluate --dry-run

  preview-matches-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: The fixture must match what Python produces today
        run: |
          python tests/mirror_cases.py
          git diff --exit-code tests/fixtures/mirror.json
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit -p tsconfig.test.json
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
